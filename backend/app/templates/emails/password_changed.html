<!DOCTYPE html>

<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Contraseña actualizada - AURA
  </title>
</head>

<body
  style="
    margin: 0;
    padding: 0;
    background-color: #f4f1ec;
    font-family: Arial, Helvetica, sans-serif;
  "
>

  <table
    width="100%"
    cellspacing="0"
    cellpadding="0"
    border="0"
    role="presentation"
    style="
      padding: 40px 15px;
      background-color: #f4f1ec;
    "
  >

    <tr>

      <td align="center">

        <table
          width="100%"
          cellspacing="0"
          cellpadding="0"
          border="0"
          role="presentation"
          style="
            max-width: 600px;
            background-color: #fffdf9;
            border: 1px solid #e2dcd3;
          "
        >

          <tr>

            <td
              align="center"
              style="
                padding: 48px 30px 20px;
              "
            >

              <div
                style="
                  font-family: Georgia, serif;
                  font-size: 34px;
                  letter-spacing: 9px;
                  color: #1f1c18;
                "
              >
                AURA
              </div>

            </td>

          </tr>


          <tr>

            <td
              style="
                padding: 20px 55px 50px;
              "
            >

              <h1
                style="
                  margin: 0 0 25px;
                  font-family: Georgia, serif;
                  font-size: 27px;
                  font-weight: 400;
                  text-align: center;
                  color: #27221c;
                "
              >
                Contraseña actualizada
              </h1>


              <p
                style="
                  font-size: 15px;
                  line-height: 1.7;
                  color: #514a42;
                "
              >
                Hola {{ first_name }},
              </p>


              <p
                style="
                  font-size: 15px;
                  line-height: 1.7;
                  color: #514a42;
                "
              >
                La contraseña de tu cuenta
                AURA fue modificada
                correctamente.
              </p>


              <p
                style="
                  margin-top: 25px;
                  font-size: 13px;
                  line-height: 1.7;
                  color: #826e55;
                "
              >
                Si tú no realizaste este cambio,
                te recomendamos contactar con
                soporte lo antes posible.
              </p>

            </td>

          </tr>

        </table>

      </td>

    </tr>

  </table>

</body>

</html>
