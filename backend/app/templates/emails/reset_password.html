<!DOCTYPE html>

<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Restablecer contraseña - AURA
  </title>
</head>

<body
  style="
    margin: 0;
    padding: 0;
    background-color: #f4f1ec;
    font-family: Arial, Helvetica, sans-serif;
    color: #2d2924;
  "
>

  <table
    width="100%"
    cellspacing="0"
    cellpadding="0"
    border="0"
    role="presentation"
    style="
      background-color: #f4f1ec;
      padding: 40px 15px;
    "
  >

    <tr>
      <td align="center">

        <table
          width="100%"
          cellspacing="0"
          cellpadding="0"
          border="0"
          role="presentation"
          style="
            max-width: 600px;
            background-color: #fffdf9;
            border: 1px solid #e2dcd3;
          "
        >

          <tr>

            <td
              align="center"
              style="
                padding: 48px 30px 25px;
              "
            >

              <div
                style="
                  font-family: Georgia, serif;
                  font-size: 34px;
                  letter-spacing: 9px;
                  color: #1f1c18;
                "
              >
                AURA
              </div>

              <div
                style="
                  margin-top: 10px;
                  font-size: 10px;
                  letter-spacing: 3px;
                  color: #a18d70;
                "
              >
                PERFUMERÍA
              </div>

            </td>

          </tr>


          <tr>

            <td
              style="
                padding: 20px 55px 50px;
              "
            >

              <h1
                style="
                  margin: 0 0 24px;
                  font-family: Georgia, serif;
                  font-size: 27px;
                  font-weight: 400;
                  text-align: center;
                  color: #27221c;
                "
              >
                Restablece tu contraseña
              </h1>


              <p
                style="
                  font-size: 15px;
                  line-height: 1.7;
                  color: #514a42;
                "
              >
                Hola {{ first_name }},
              </p>


              <p
                style="
                  margin-bottom: 30px;
                  font-size: 15px;
                  line-height: 1.7;
                  color: #514a42;
                "
              >
                Recibimos una solicitud para
                cambiar la contraseña de tu
                cuenta de AURA.
              </p>


              <table
                width="100%"
                cellspacing="0"
                cellpadding="0"
                border="0"
                role="presentation"
              >

                <tr>

                  <td align="center">

                    <a
                      href="{{ reset_url }}"
                      style="
                        display: inline-block;
                        padding: 15px 30px;
                        background-color: #29241e;
                        color: #ffffff;
                        text-decoration: none;
                        font-size: 12px;
                        letter-spacing: 1.4px;
                      "
                    >
                      RESTABLECER CONTRASEÑA
                    </a>

                  </td>

                </tr>

              </table>


              <p
                style="
                  margin: 32px 0 0;
                  text-align: center;
                  font-size: 12px;
                  line-height: 1.6;
                  color: #8b8175;
                "
              >
                Este enlace estará disponible
                durante 30 minutos.
              </p>


              <p
                style="
                  margin: 12px 0 0;
                  text-align: center;
                  font-size: 12px;
                  line-height: 1.6;
                  color: #8b8175;
                "
              >
                Si no solicitaste este cambio,
                puedes ignorar este mensaje.
              </p>

            </td>

          </tr>

        </table>

      </td>
    </tr>

  </table>

</body>

</html>
